<!-- CraftApps-Pulse · página de prueba con datos inventados -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Prueba · CraftApps-Pulse</title>
</head>
<body>
<script>
function simulador(nombres) {
  const CLAVE = 'tablero-prueba:datos2';
  const DIA = 864e5;
  const azar = (min, max) => min + Math.floor(Math.random() * (max - min + 1));
  const iso = instante => new Date(instante).toISOString().replace(/\.\d+Z$/, 'Z');
  const inicial = () => Object.fromEntries(nombres.map((nombre, i) => {
    const cerrados = azar(0, 60);
    return [nombre, {
      tag: i === nombres.length - 1 ? null : `v0.${azar(8, 18)}.${azar(0, 3)}`,
      publicada: iso(Date.now() - azar(1, 40) * DIA),
      adelante: azar(20, 900),
      cerrados,
      bugs: Math.min(cerrados, azar(0, 5)),
      commits30: azar(300, 5000),
      estrellas: azar(500, 20000),
      forks: azar(100, 6000),
      empujado: iso(Date.now()),
    }];
  }));

  const hoy = () => new Date().toISOString().slice(0, 10);
  const crearHoy = () => ({ dia: hoy(), commits: azar(0, 80), reportados: azar(0, 15), cerrados: azar(0, 15) });
  const crearHistoria = repo => {
    const dias = azar(25, 200);
    const desde = iso(Date.now() - dias * DIA).slice(0, 10);
    const commits = Array.from({ length: dias }, () => azar(0, 120));
    const reportados = Array.from({ length: dias }, () => azar(0, 25));
    const cerrados = reportados.map(r => Math.max(0, r + azar(-8, 6)));
    let acumulado = 0;
    const abiertos = reportados.map((r, i) => (acumulado = Math.max(0, acumulado + r - cerrados[i])));
    const releases = [];
    for (let dia = azar(3, 10), menor = 1; dia < dias - 3; dia += azar(2, 12), menor++) {
      releases.push([`v0.${menor}.0`, iso(Date.parse(`${desde}T15:00:00Z`) + dia * DIA)]);
    }
    if (repo.tag) releases.push([repo.tag, repo.publicada]);
    releases.sort((a, b) => a[1].localeCompare(b[1]));
    return { desde, commits, reportados, cerrados, abiertos, releases: releases.filter(([, fecha]) => fecha.slice(0, 10) < hoy()), completo: { commits: true, issues: true }, progreso: { issues: 1 } };
  };

  let datos = null;
  try {
    datos = JSON.parse(localStorage.getItem(CLAVE));
  } catch {}
  if (!datos || nombres.some(nombre => !datos[nombre])) datos = inicial();
  for (const nombre of nombres) {
    datos[nombre].historia ??= crearHistoria(datos[nombre]);
    if (datos[nombre].hoy?.dia !== hoy()) datos[nombre].hoy = crearHoy();
  }
  const abiertosHoy = repo => Math.max(0, repo.historia.abiertos.at(-1) + repo.hoy.reportados - repo.hoy.cerrados);
  const modo = { sinCupo: false, sinRed: false };
  const guardar = () => {
    try {
      localStorage.setItem(CLAVE, JSON.stringify(datos));
    } catch {}
  };
  guardar();

  const reset = segundos => String(Math.floor(Date.now() / 1000) + segundos);
  const respuesta = (cuerpo, recurso, extra = {}, status = 200) => new Response(JSON.stringify(cuerpo), {
    status,
    headers: {
      'content-type': 'application/json',
      'x-ratelimit-resource': recurso,
      'x-ratelimit-limit': recurso === 'search' ? '10' : '60',
      'x-ratelimit-remaining': modo.sinCupo && recurso === 'core' ? '0' : '59',
      'x-ratelimit-reset': reset(recurso === 'search' ? 60 : 1800),
      ...extra,
    },
  });
  const noExiste = () => respuesta({ message: 'Not Found' }, 'core', {}, 404);

  const real = window.fetch.bind(window);
  window.fetch = async (url, opciones) => {
    const texto = decodeURIComponent(String(url));
    if (texto.includes('data/estado.json')) return new Response('', { status: 404 });
    if (texto.includes('data/historial.json')) {
      const repos = Object.fromEntries(nombres.map(nombre => [nombre, datos[nombre].historia]));
      return new Response(JSON.stringify({ generado: iso(Date.now()), repos }), { status: 200, headers: { 'content-type': 'application/json' } });
    }
    if (!texto.startsWith('https://api.github.com')) return real(url, opciones);
    await new Promise(listo => setTimeout(listo, 60 + Math.random() * 140));
    if (modo.sinRed) throw new TypeError('Failed to fetch');
    if (texto.includes('/rate_limit')) {
      return respuesta({
        resources: {
          core: { limit: 60, remaining: modo.sinCupo ? 0 : 59, reset: Number(reset(1800)) },
          search: { limit: 10, remaining: 10, reset: Number(reset(60)) },
        },
      }, 'core');
    }
    if (modo.sinCupo && !texto.includes('/search/')) return respuesta({ message: 'API rate limit exceeded' }, 'core', {}, 403);
    if (texto.includes('/orgs/')) {
      return respuesta(nombres.map(nombre => ({
        name: nombre,
        default_branch: 'main',
        stargazers_count: datos[nombre].estrellas,
        forks_count: datos[nombre].forks,
        html_url: `https://github.com/storytold/${nombre}`,
        pushed_at: datos[nombre].empujado,
      })), 'core');
    }
    const nombre = (texto.match(/repos\/storytold\/([^/?]+)/) || texto.match(/repo:storytold\/(\S+)/) || [])[1];
    const repo = datos[nombre];
    if (!repo) return noExiste();
    if (texto.includes('/releases/latest')) {
      if (!repo.tag) return noExiste();
      return respuesta({ tag_name: repo.tag, published_at: repo.publicada, html_url: `https://github.com/storytold/${nombre}/releases` }, 'core');
    }
    if (texto.includes('/compare/')) return respuesta({ ahead_by: repo.adelante }, 'core');
    const deHoy = `>=${hoy()}T00:00:00Z`;
    if (texto.includes('/commits?')) {
      const total = texto.includes(`since=${hoy()}T00:00:00Z`) ? repo.hoy.commits : repo.commits30;
      return respuesta(total ? [{}] : [], 'core', total > 1 ? { link: `<https://api.github.com/prueba?per_page=1&page=${total}>; rel="last"` } : {});
    }
    if (texto.includes('/search/issues')) {
      const total = texto.includes('is:open') ? abiertosHoy(repo)
        : texto.includes(`created:${deHoy}`) ? repo.hoy.reportados
        : texto.includes(`closed:${deHoy}`) ? repo.hoy.cerrados
        : texto.includes('label:') ? repo.bugs
        : repo.cerrados;
      return respuesta({ total_count: total, incomplete_results: false, items: [] }, 'search');
    }
    return noExiste();
  };

  window.__prueba = { datos, modo, guardar, nombres, azar, iso };
}

function panel() {
  const prueba = window.__prueba;
  const caja = document.createElement('aside');
  caja.className = 'panel-prueba';
  caja.innerHTML = `
    <style>
      .panel-prueba { position: fixed; right: 16px; bottom: 16px; z-index: 30; max-width: calc(100vw - 32px); }
      .panel-prueba details { background: var(--superficie); border: 1px solid var(--regla-2); border-radius: 6px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18); }
      .panel-prueba summary { padding: 9px 12px; font: 600 12.5px var(--mono); cursor: pointer; color: var(--brillo-texto); }
      .panel-prueba .botones { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 0 12px 12px; }
      .panel-prueba button { padding: 7px 10px; font-size: 12.5px; text-align: left; }
      .panel-prueba button[aria-pressed="true"] { border-color: var(--atraso); color: var(--atraso); }
      .panel-prueba p { margin: 0; padding: 0 12px 10px; font-size: 12px; color: var(--tenue); max-width: 34ch; }
      .etiqueta-prueba { margin-left: 10px; padding: 2px 7px; font: 600 11px var(--mono); vertical-align: middle; color: var(--brillo-texto); border: 1px solid var(--brillo); border-radius: 3px; letter-spacing: 0.04em; }
    </style>
    <details open>
      <summary>Modo prueba</summary>
      <p>Datos inventados, sin usar la API. Cada botón cambia los datos y consulta de nuevo; «Refrescar igual» respeta la espera, que aquí es de 20 s en vez de 15 min.</p>
      <div class="botones">
        <button type="button" data-accion="commits">+ commits</button>
        <button type="button" data-accion="issues">+ issues</button>
        <button type="button" data-accion="release">Nueva release</button>
        <button type="button" data-accion="todo">Todo junto</button>
        <button type="button" data-accion="nada">Refrescar igual</button>
        <button type="button" data-accion="reiniciar">Reiniciar datos</button>
        <button type="button" data-accion="cupo" aria-pressed="false">Sin cupo</button>
        <button type="button" data-accion="red" aria-pressed="false">Sin red</button>
      </div>
    </details>`;
  document.body.append(caja);
  document.querySelector('h1').insertAdjacentHTML('beforeend', '<span class="etiqueta-prueba">PRUEBA</span>');

  const conRelease = () => prueba.nombres.filter(nombre => prueba.datos[nombre].tag);
  const elegir = cuantos => conRelease().sort(() => Math.random() - 0.5).slice(0, cuantos);
  const empujar = nombre => { prueba.datos[nombre].empujado = prueba.iso(Date.now()); };
  const acciones = {
    commits: () => elegir(prueba.azar(1, 3)).forEach(nombre => {
      const suma = prueba.azar(1, 6);
      prueba.datos[nombre].adelante += suma;
      prueba.datos[nombre].hoy.commits += suma;
      empujar(nombre);
    }),
    issues: () => elegir(prueba.azar(1, 2)).forEach(nombre => {
      const repo = prueba.datos[nombre];
      const suma = prueba.azar(1, 3);
      repo.cerrados += suma;
      if (Math.random() < 0.4) repo.bugs += 1;
      repo.hoy.cerrados += suma;
    }),
    release: () => {
      const [nombre] = elegir(1);
      const repo = prueba.datos[nombre];
      repo.tag = repo.tag.replace(/\.(\d+)\.(\d+)$/, (todo, menor) => `.${Number(menor) + 1}.0`);
      repo.publicada = prueba.iso(Date.now() - 5 * 60e3);
      repo.adelante = prueba.azar(0, 4);
      repo.cerrados = 0;
      repo.bugs = 0;
      repo.historia.releases.push([repo.tag, repo.publicada]);
      empujar(nombre);
    },
    todo: () => {
      acciones.release();
      acciones.commits();
      acciones.issues();
    },
    nada: () => {},
    cupo: boton => {
      prueba.modo.sinCupo = !prueba.modo.sinCupo;
      boton.setAttribute('aria-pressed', String(prueba.modo.sinCupo));
    },
    red: boton => {
      prueba.modo.sinRed = !prueba.modo.sinRed;
      boton.setAttribute('aria-pressed', String(prueba.modo.sinRed));
    },
    reiniciar: () => {
      for (const clave of Object.keys(localStorage)) if (clave.startsWith('tablero-prueba:')) localStorage.removeItem(clave);
      location.reload();
    },
  };

  caja.addEventListener('click', evento => {
    const boton = evento.target.closest('button[data-accion]');
    if (!boton) return;
    acciones[boton.dataset.accion](boton);
    if (boton.dataset.accion === 'reiniciar') return;
    prueba.guardar();
    const forzar = boton.dataset.accion !== 'nada';
    const refrescar = () => {
      if (estado.ocupado) return setTimeout(refrescar, 400);
      if (forzar) {
        cache.ultimaConsulta = 0;
        guardar();
      }
      actualizar(true);
    };
    refrescar();
  });
}

fetch('index.html', { cache: 'no-store' })
  .then(res => {
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.text();
  })
  .then(html => {
    const lista = /const REPOS = \[([\s\S]*?)\];/.exec(html)?.[1] ?? '';
    const nombres = [...lista.matchAll(/'([^']+)'/g)].map(coincidencia => coincidencia[1]);
    const pagina = html
      .replaceAll('tablero-storytold:', 'tablero-prueba:')
      .replace('const INTERVALO = 15 * 60 * 1000;', 'const INTERVALO = 20 * 1000;')
      .replace('<script>', `<script>(${simulador})(${JSON.stringify(nombres)});<\/script>\n<script>`)
      .replace('</body>', `<script>(${panel})();<\/script>\n</body>`);
    document.open();
    document.write(pagina);
    document.close();
  })
  .catch(error => {
    document.body.textContent = `No pude cargar index.html (${error.message}). Abre esta página desde un servidor, no como archivo.`;
  });
</script>
</body>
</html>
