      </div>
      <p class="nota-detalle">${esc(t.notaCiclos)}</p>
    </section>` : `<p class="nota-detalle" style="margin-top:20px">${esc(detalle.cargando ? t.cargandoHistorial : t.sinHistorial)}</p>`}
    ${notas.length ? `<p class="nota-detalle" style="margin-top:16px">${esc(notas.join(' '))}</p>` : ''}
  </div>`;

  dialogo.querySelector('[data-accion="cerrar"]').addEventListener('click', () => dialogo.close());
  dialogo.querySelector('[data-accion="anterior"]').addEventListener('click', () => abrirDetalle(vecino(-1)));
  dialogo.querySelector('[data-accion="siguiente"]').addEventListener('click', () => abrirDetalle(vecino(1)));
  dialogo.querySelectorAll('[data-rango]').forEach(boton => boton.addEventListener('click', () => {
    detalle.rango = Number(boton.dataset.rango);
    renderDetalle();
  }));
  if (enfocado) dialogo.querySelector(`[data-foco="${enfocado}"]`)?.focus();
  dibujarDetalle();
}

const COLUMNAS = [
  { id: 'nombre', clase: 'app' },
  { id: 'version', clase: 'ver' },
  { id: 'fecha', opcional: true },
  { id: 'dias', num: true },
  { id: 'adelante', num: true },
  { id: 'cerrados', num: true },
  { id: 'bugs', num: true, opcional: true },
  { id: 'commits30', num: true },
  { id: 'estrellas', num: true, opcional: true },
  { id: 'forks', num: true, opcional: true },
];

function valorColumna(f, col) {
  if (col === 'version') return f.release?.tag ?? null;
  if (col === 'fecha') return f.release ? Date.parse(f.release.fecha) : null;
  return f[col] ?? null;
}

function celda(f, col) {
  const pendiente = f.estado === 'pendiente';
  const cifra = v => (v == null ? `<span class="tenue">${pendiente ? '…' : '—'}</span>` : numero.format(v));
  switch (col.id) {
    case 'nombre':
      return `<button type="button" class="abrir-app" data-app="${esc(f.nombre)}" aria-label="${esc(t.verDetalle(f.nombre))}">${esc(f.nombre)}</button><a class="externo" href="${esc(f.url)}" aria-label="${esc(t.externo(f.nombre))}">↗</a>`;
    case 'version':
      if (f.release) return `<a href="${esc(f.release.url)}">${esc(f.release.tag)}</a>`;
      return `<span class="tenue">${f.estado === 'sin' ? esc(t.sinReleases) : '…'}</span>`;
    case 'fecha':
      return f.release ? esc(fechaCorta.format(new Date(f.release.fecha))) : '<span class="tenue">—</span>';
    case 'dias':
      if (!f.release) return cifra(null);
      return `<span class="estado"><svg width="11" height="10" aria-hidden="true">${formaEstado(f.estado, 5.5, 5)}</svg>${f.dias === 0 ? esc(t.hoy) : `${numero.format(f.dias)} d`}<span class="solo-lector">, ${esc(f.estado === 'atrasado' ? t.atrasado : t.alDia)}</span></span>`;
    case 'adelante':
      return cifra(f.adelante) + (f.cambio.adelante ? `<span class="delta">+${numero.format(f.cambio.adelante)}</span>` : '');
    case 'cerrados':
    case 'bugs':
      if (f.estado === 'sin') return '<span class="tenue">—</span>';
      if (f.release && f.cerrados === undefined) return '<span class="tenue">…</span>';
      return cifra(f[col.id]) + (col.id === 'cerrados' && f.cambio.cerrados ? `<span class="delta">+${numero.format(f.cambio.cerrados)}</span>` : '');
    default:
      return cifra(f[col.id]);
  }
}

function encabezadosTabla() {
  $('#tabla thead tr').innerHTML = COLUMNAS.map(col => `
    <th scope="col" class="${col.num ? 'num' : col.clase ?? ''}${col.opcional ? ' opc' : ''}" data-col="${col.id}">
      <button type="button" data-col="${col.id}">${esc(t.columnas[col.id])}<span class="flecha" aria-hidden="true"></span></button>
    </th>`).join('');
}

function montarTabla() {
  $('#tabla thead').addEventListener('click', evento => {
    const boton = evento.target.closest('button[data-col]');
    if (!boton) return;
    const col = COLUMNAS.find(c => c.id === boton.dataset.col);
    estado.orden = estado.orden.col === col.id
      ? { col: col.id, dir: -estado.orden.dir }
      : { col: col.id, dir: col.num ? -1 : 1 };
    renderTabla();
  });
}

function renderTabla() {
  const { col, dir } = estado.orden;
  const lista = filas().sort((a, b) => {
    const va = valorColumna(a, col);
    const vb = valorColumna(b, col);
    if (va == null && vb == null) return a.nombre.localeCompare(b.nombre);
    if (va == null) return 1;
    if (vb == null) return -1;
    const comparacion = typeof va === 'string' ? va.localeCompare(vb, 'es', { numeric: true }) : va - vb;
    return comparacion * dir || a.nombre.localeCompare(b.nombre);
  });
  document.querySelectorAll('#tabla th').forEach(th => {
    const activa = th.dataset.col === col;
    if (activa) th.setAttribute('aria-sort', dir > 0 ? 'ascending' : 'descending');
    else th.removeAttribute('aria-sort');
    th.querySelector('.flecha').textContent = activa ? (dir > 0 ? '↑' : '↓') : '';
  });
  $('#tabla tbody').innerHTML = lista.map(f => `<tr${f.cambio.adelante || f.cambio.cerrados ? ' class="reciente"' : ''}>${COLUMNAS.map(c => `<td class="${c.num ? 'num' : c.clase ?? ''}${c.opcional ? ' opc' : ''}">${celda(f, c)}</td>`).join('')}</tr>`).join('');
}

function iniciar() {
  usarIdioma(detectarIdioma());
  aplicarPrefs();
  encabezadosTabla();
  montarTabla();

  $('#idioma').addEventListener('change', evento => {
    try {
      localStorage.setItem(CLAVE_IDIOMA, evento.target.value);
    } catch {}
    usarIdioma(evento.target.value);
    aplicarPrefs();
    encabezadosTabla();
    render();
  });

  for (const clave of ['sonido', 'efectos']) {
    $(`#${clave}`).addEventListener('click', () => {
      prefs[clave] = !prefs[clave];
      guardarPrefs();
      aplicarPrefs();
      if (clave === 'sonido' && prefs.sonido) prepararAudio()?.then(() => sonar('activar'));
      render();
    });
  }
  for (const tipo of ['pointerdown', 'keydown']) document.addEventListener(tipo, () => prepararAudio());

  $('#resumen').addEventListener('click', evento => {
    const boton = evento.target.closest('button[data-ir]');
    if (boton) irAFila(boton.dataset.ir);
  });

  const grafico = $('#grafico');
  const filaVigente = fila => (verNovedad(fila.dataset.nombre)
    ? grafico.querySelector(`.fila[data-nombre="${CSS.escape(fila.dataset.nombre)}"]`)
    : fila);
  grafico.addEventListener('pointermove', evento => {
    const fila = evento.target.closest('.fila');
    if (!fila) return ocultarTip();
    const caja = grafico.getBoundingClientRect();
    mostrarTip(filaVigente(fila), evento.clientX - caja.left);
  });
  grafico.addEventListener('pointerleave', ocultarTip);
  grafico.addEventListener('focusin', evento => {
    const fila = evento.target.closest('.fila');
    if (fila) mostrarTip(filaVigente(fila));
  });
  grafico.addEventListener('focusout', ocultarTip);
  grafico.addEventListener('keydown', evento => {
    if (evento.key === 'Escape') ocultarTip();
    const fila = evento.target.closest('.fila');
    if (fila && (evento.key === 'Enter' || evento.key === ' ')) {
      evento.preventDefault();
      abrirDetalle(fila.dataset.nombre);
    }
  });
  grafico.addEventListener('click', evento => {
    const fila = evento.target.closest('.fila');
    if (fila) abrirDetalle(fila.dataset.nombre);
  });
  $('#tabla tbody').addEventListener('click', evento => {
    const boton = evento.target.closest('.abrir-app');
    if (boton) abrirDetalle(boton.dataset.app);
  });
  const dialogo = $('#detalle');
  dialogo.addEventListener('click', evento => {
    if (evento.target === dialogo) dialogo.close();
  });
  window.addEventListener('resize', () => {
    if (dialogo.open) dibujarDetalle();
  });

  let pendiente = 0;
  new ResizeObserver(() => {
    cancelAnimationFrame(pendiente);
    pendiente = requestAnimationFrame(renderGrafico);
  }).observe(grafico);

  $('#actualizar').addEventListener('click', () => actualizar(true));
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && Date.now() - estado.intento >= INTERVALO) actualizar();
  });
  window.addEventListener('online', () => actualizar());
  setInterval(() => actualizar(), INTERVALO);
  setInterval(() => {
    renderCabecera();
    renderAvisos();
  }, MIN);

  window.addEventListener('pagehide', () => {
    if (estado.ocupado) soltarTurno();
  });
  window.addEventListener('storage', evento => {
    if (evento.key !== CLAVE || estado.ocupado) return;
    cache = leer();
    render();
  });

  efectos.crecerDesde = Date.now();
  render();
  programarSumas(sumasVigentes());
  actualizar();
}

iniciar();
</script>
</body>
